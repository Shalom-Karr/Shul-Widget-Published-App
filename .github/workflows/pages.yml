name: Deploy GitHub Pages

# Custom Pages deploy that checks out WITHOUT submodules — the default Pages
# build tries to recursively clone the private `src` submodule and fails
# ("Repository not found"). The landing page is just static files at the repo
# root, so no submodule is needed to publish it.

on:
  push:
    branches: [main]
    # Only redeploy when the actual site changes — not for README/CHANGELOG edits.
    # (The page fetches CHANGELOG.md live at runtime, so it needs no rebuild.)
    paths:
      - 'index.html'
      - 'logo.png'
      - 'LICENSE'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
